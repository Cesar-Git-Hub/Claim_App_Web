{% extends "core/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-lg login-card">
      <div class="card-body">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <input type="text" name="username" id="id_username" class="form-control"
                   placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" name="password" id="id_password" class="form-control"
                   placeholder="Ingresa tu contraseña" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'signup' %}">Crear cuenta</a></p>

{% endblock %}
