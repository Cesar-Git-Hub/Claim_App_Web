{% extends "core/base.html" %}
{% block title %}Subir archivo{% endblock %}
{% block content %}

<h2 class="mb-4">Subir archivo</h2>

<form method="post" enctype="multipart/form-data" class="d-flex flex-column align-items-center">
  {% csrf_token %}
  
  <div class="mb-3 w-50">
    <label for="file" class="form-label">Selecciona tu archivo (CSV, Excel, etc.)</label>
    <input type="file" name="file" id="file" class="form-control">
  </div>
  
  <button type="submit" class="btn btn-success">Cargar</button>
</form>

{% endblock %}
